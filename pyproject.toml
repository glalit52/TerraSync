[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrashield"
version = "0.1.0"
description = "Satellite change intelligence for wide-area monitoring: detection, change, pattern-of-life deviation and a ranked alert queue, each finding carrying its evidence."
readme = "README.md"
requires-python = ">=3.11"

# Empty on purpose. The analysis core uses nothing outside the standard
# library -- no numpy, no GDAL, no rasterio, no ML framework -- so an on-premise
# or air-gapped install is a copy rather than a procurement exercise. That is a
# deliberate trade: see docs/04-deploying-for-real.md for what to replace when
# throughput matters more than portability.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

# Reading real imagery. Optional on purpose: the analysis core and the
# catalogue search both work without it, so an on-premise install stays a copy
# rather than a procurement exercise. What this adds is windowed reads out of
# cloud-optimised GeoTIFFs -- HTTP range requests, tile tables, several codecs
# and a reprojection -- which is GDAL's job. Reimplementing that unverified is
# how a pipeline gets silently wrong pixels instead of an error, and wrong
# pixels here look exactly like real change.
imagery = ["rasterio>=1.3"]

[project.scripts]
terrashield = "terrashield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
