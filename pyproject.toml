[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrashield"
version = "0.1.0"
description = "Satellite change intelligence for wide-area monitoring: detection, change, pattern-of-life deviation and a ranked alert queue, each finding carrying its evidence."
readme = "README.md"
requires-python = ">=3.11"

# Empty on purpose. The analysis core uses nothing outside the standard
# library -- no numpy, no GDAL, no rasterio, no ML framework -- so an on-premise
# or air-gapped install is a copy rather than a procurement exercise. That is a
# deliberate trade: see docs/04-deploying-for-real.md for what to replace when
# throughput matters more than portability.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
terrashield = "terrashield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
