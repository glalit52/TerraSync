name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Reading real pixels needs the optional imagery extra (rasterio). The core
  # `test` job below stays dependency-free on purpose, so these tests skip there and
  # run here, against GeoTIFFs they write themselves -- no network.
  imagery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[imagery]" pytest
      - run: python -m pytest -q tests/test_ts_cog.py tests/test_ts_providers.py

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The core has no dependencies on purpose, so there is nothing to
      # install but the test runner itself.
      - run: pip install pytest
      - run: python -m pytest -q

      # The console cannot be regenerated in CI -- that would mean running
      # months of the monitoring pipeline over four sites -- so this checks the
      # drift that actually happens instead: a rebuilt dataset left with a
      # stale page, or a chip referenced but never committed.
      - name: console is consistent with its dataset
        run: python3 scripts/check_dashboard.py

      - name: static build succeeds
        run: bash scripts/build_static.sh

  console:
    # The analyst console in frontend/. Type-checked, unit-tested and built on
    # every change, because the build output is what an air-gapped site
    # receives and a broken bundle cannot be fixed there.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
